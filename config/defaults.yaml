# Общие пороги и окна пайплайна. Клиентский config.yaml может переопределять
# отдельные значения (например, data_window). Всё, что специфично для клиента,
# живёт в clients/<name>/config.yaml, здесь — только дефолты методологии.

data_window_months: 12          # окно анализа по умолчанию

utm_undefined_threshold: 0.25   # доля визитов с меткой "Не определено":
                                # <25%  -> списываем на рекламу (шум приемлем)
                                # >=25% -> флаг "источник не определён наверняка"

significance_alpha: 0.05        # уровень значимости для сравнений сегментов

min_sample_visits: 500          # ниже этого числа визитов различия помечаются
                                # "незначимо / мало данных"

# Отбор значений разрезов высокой кардинальности (PERF-1A, исправлено SEG-FIX).
# Порог РАСЧЁТА и порог ДОСТАТОЧНОСТИ ВЫБОРКИ — разные величины и не должны
# совпадать. `min_sample_visits` решает, можно ли делать вывод по сегменту, и
# применяется там, где сегмент превращается в кандидата в находку. Здесь —
# только дешёвый порог расчёта: значение с единичными визитами не стоит
# отдельной строки артефакта. Смешение двух порогов (segment_min_visits =
# min_sample_visits = 500) удаляло данные до того, как до них доходила логика
# уверенности: на 220volt.kz оставалось 112 значений entry_page из 28 689
# (покрытие 30.75%), на pognali.rent — 2 из 107, то есть сегментный анализ
# точки входа исчезал целиком. Ключ `segment_min_visits` больше не читается.
segment_compute_min_visits: 30  # порог РАСЧЁТА: ниже — значение не получает
                                # отдельной строки и уходит в "__other__"
segment_max_values: 2000        # жёсткий потолок числа строк одного разреза
segment_coverage_target: 0.80   # ЦЕЛЬ покрытия, а не правило остановки: отбор
                                # берёт все прошедшие порог значения до
                                # segment_max_values, а факт достижения цели
                                # пишется в манифест (coverage_target_met)
segment_entry_page_top_per_type: 1500  # потолок строк entry_page внутри одного
                                # page_type (топ-N по визитам): не даёт одному
                                # типу страниц (у интернет-магазина — product)
                                # выбрать весь бюджет segment_max_values и
                                # вытеснить из разреза остальные типы
segment_filtered_dimensions:    # разрезы, к которым правило применяется;
                                # разрезы вне списка считаются целиком
                                # (month/channel/device/page_type — низкая
                                # кардинальность, month к тому же вход
                                # seasonality)
  - "entry_page"
  - "search_phrase"
  - "key_phrase"
  - "placement"
  - "region"

goal_inflation_warning: 1.3     # достижения/визиты выше порога ->
                                # цель, вероятно, переотрабатывает (двойной счёт)

currency_round: 0               # округление рублёвых сумм на выводе (знаков)

manual_source_confidence_cap: "MED"   # ни одна проверка, чьи requires закрыты
                                       # источником с mode=manual, не получает
                                       # confidence=HIGH, даже при значимом p-value

analyze_input_pack_byte_cap: 150000   # жёсткий потолок тела запроса analyze
                                       # (send_pack + system_prompt, UTF-8).
                                       # ≈68 тыс. токенов при 2.2 байта/токен —
                                       # запас к контекстному окну модели с
                                       # учётом ответа (LLM_MAX_TOKENS).
                                       # Превышение после урезания контекста —
                                       # ошибка стадии.
analyze_input_pack_warn_bytes: 120000  # мягкий порог: пакет ещё отправляется,
                                       # но в лог стадии пишется WARNING —
                                       # сигнал, что пора сжимать пакет.
                                       # На проверку assumptions ни один из
                                       # порогов не влияет: корпус сверки
                                       # берётся из полного пакета
                                       # (draft_findings.build_validation_corpus).

analyze_candidate_top_n: 25            # последний эшелон byte-cap: сколько
                                       # кандидатов группы уходит в модель
                                       # поимённо. Стартовый порог первого
                                       # эшелона — при нехватке места N
                                       # снижается автоматически (25 -> 12 ->
                                       # 6 …) сразу для всех групп. Явный 0 —
                                       # предельное сжатие: каждая группа
                                       # сразу схлопывается в один агрегат
                                       # (tail_aggregate), поимённых
                                       # кандидатов в пакете не остаётся.
                                       # Это продуктовый рычаг Р3 — единственное
                                       # место оптимизации пакета, где реально
                                       # теряется информация.
analyze_candidate_impact_keys:         # приоритет полей влияния: первое поле
                                       # списка, реально различающее строки
                                       # группы, задаёт и порядок отбора top-N
                                       # внутри группы, и порядок объединения
                                       # полностью схлопнутых групп на втором
                                       # эшелоне (_merge_collapsed_groups —
                                       # один критерий на оба, своего он не
                                       # вводит). Пустой список — отказ от
                                       # ранжирования: фолбэк на исходный
                                       # порядок строк (criterion=row_order).
  - "payload.money_amount_rub"
  - "money_amount_rub"
  - "payload.loss_rub"
  - "payload.cost_rub"
  - "payload.gap_visits"
  - "payload.visits"
  - "payload.clicks"
  - "payload.shows"

attribution:
  # Уровень ключа атрибуции (задача 7G) считается детерминированно по
  # фактической canonical-схеме клиента: L2 — рабочий ключ склейки CRM с
  # визитами, L1 — заполненное поле источника/utm, L0 — CRM есть, ключа нет,
  # L_UNKNOWN — CRM-источника нет вовсе. Ни один порог и ни одно имя колонки
  # НЕ живёт в коде (принцип 1 CLAUDE.md) — только здесь.

  # Доли непустых значений, при которых поле считается фактически заполненным.
  # Сравнение включительное: ровно порог -> поле проходит.
  min_join_key_fill_rate: 0.5     # ключ склейки (client_id/yclid/gclid/контакт)
  min_join_success_rate: 0.5      # доля записей CRM, для которых JOIN с visits
                                  # дал хотя бы одно совпадение (L2 требует
                                  # фактического JOIN, а не наличия колонки)
  min_source_fill_rate: 0.5       # поле источника/utm в CRM (L1)
  min_repeat_key_fill_rate: 0.5   # ключ склейки повторных обращений

  # Значения-заглушки: формально непустые, фактически «не заполнено».
  # Сравнение по нижнему регистру после trim.
  placeholder_values: ["unknown", "не определено", "(not set)", "none", "null", "-", "n/a", "нет"]

  # Пары «колонка CRM -> колонка visits» для фактического JOIN.
  join_keys:
    - crm_column: "client_id"
      visits_column: "client_id"
    - crm_column: "yclid"
      visits_column: "click_id"
    - crm_column: "gclid"
      visits_column: "click_id"
    - crm_column: "click_id"
      visits_column: "click_id"
  # Контакт: даёт L2 только вместе с непустым таймстампом И фактическим JOIN.
  contact_keys:
    - crm_column: "phone_hash"
      visits_column: "phone_hash"
  timestamp_columns: ["lead_date"]
  source_columns: ["source_norm", "utm_source", "utm_campaign", "utm_source_raw"]
  repeat_columns: ["is_new_client", "is_repeat"]

crux_min_field_data: true             # если CrUX не отдал полевые данные —
                                       # находки CWV капаются в MED автоматически

block4_seo:
  # S07 (каталог v2 §9, строка 263: "Сопоставить кластеры Wordstat/GSC с
  # картой страниц", источник "Wordstat + GSC + сайт"). Минимальный
  # суммарный спрос (SUM(wordstat.count) за период) кластера scope==
  # 'gap-specific', чтобы отсутствие релевантной страницы считалось
  # материальной находкой, а не шумом единичных показов (тот же порядок
  # величины, что _MIN_SHOWS_FOR_OPPORTUNITY в src/compute/block4_seo.py —
  # независимая эвристика, каталог точного числа не даёт). S26 использует
  # свой собственный хардкод того же значения — вне scope этого ключа
  # (FIX-s07-site-pages-join, S26 требует отдельного фикса с позициями/гео).
  s07_min_demand_count: 20

transform:
  # T02/T03: carry-forward источника трафика для internal/undefined визитов
  # (см. marketing-diagnostics-methodology-v2.md §5). Сколько дней истории
  # клиента ДО data_window.date_from нужно для восстановления цепочки —
  # только контекст для resolve, в отчёт/метрики эти визиты не попадают.
  traffic_resolve_lookback_days: 30

  # Единый порог для GSC и Вебмастер: запросы с total_shows ниже этого
  # значения — шум (единичные показы без статистической значимости) и
  # отбрасываются на этапе build canonical seo_queries, чтобы не тащить
  # его дальше в compute/analyze.
  seo_queries_min_total_shows: 10
