# Термины отчёта диагностики маркетинга — раздел «Глоссарий».
# Загружается src/report/build_report.py:load_glossary(). Порядок — по
# смысловым группам (данные -> уверенность -> деньги -> прочее), не
# алфавитный: смешение кириллицы и латиницы делает алфавитный порядок
# нечитаемым.

terms:
  - term: "check_id"
    definition: >-
      Рабочий идентификатор проверки из каталога угроз v2: буква блока
      (D/A/T/C/S) + номер, например A07 или S12.
  - term: "Блок (D/A/T/C/S)"
    definition: >-
      Группа проверок по теме: D — доверие к данным, A — экономика рекламы,
      T — трафик и атрибуция, C — CRO и воронка, S — SEO.
  - term: "data_window (период анализа)"
    definition: >-
      Календарный период, за который считаются метрики (date_from..date_to).
  - term: "significant"
    definition: >-
      Статистическая значимость различия: p < significance_alpha и выборка
      ≥ min_sample_visits. Незначимые различия не публикуются как находки.
  - term: "HIGH"
    definition: "Уверенность на визит-уровне при выборке ≥ min_sample_visits."
  - term: "MED"
    definition: >-
      Уверенность ниже HIGH: выборка меньше порога либо хотя бы одно
      требование проверки закрыто источником в ручном режиме (manual).
  - term: "LOW"
    definition: "Уверенность-гипотеза, не подтверждённая напрямую данными."
  - term: "client-HIGH"
    definition: >-
      Факт со слов клиента о его собственных настройках. Не подчиняется
      потолку уверенности источника — это не про качество данных.
  - term: "confidence_cap (потолок уверенности)"
    definition: >-
      Максимально допустимая уверенность находки, заданная режимом источника
      (api -> HIGH, manual -> MED). Слой analyze может только понижать
      уверенность находки относительно этого потолка, никогда не повышать.
  - term: "source_modes (api / manual)"
    definition: >-
      Режим получения данных для требования проверки: api — машинная
      выгрузка, manual — ручной ввод, обход сайта или анкета аналитика.
  - term: "type (A / B / Q / A+B / A+Q)"
    definition: >-
      Уровень проверяемости угрозы: A — автоматически из выгрузок, B —
      ручная проверка (интерфейс/сайт/Вебвизор/замер), Q — требует факта или
      документа от клиента; A+B, A+Q — комбинации.
  - term: "Что не удалось проверить (деградация)"
    definition: >-
      Проверки реестра, которые нельзя посчитать при текущих источниках
      данных — раздел приводится без изменений причины отказа.
  - term: "money_category (денежная категория)"
    definition: >-
      Одна из четырёх категорий денежной оценки находки: прямой
      подтверждённый расход, потенциально исключаемый расход, снижение CPA
      при том же бюджете, эквивалент дополнительных конверсий.
  - term: "money_not_assessable («в ₽ не оценить»)"
    definition: >-
      Находка подтверждена, но денежную сумму оценить нельзя — недостаточно
      данных для расчёта, а не отсутствие эффекта.
  - term: "сценарий, не прогноз"
    definition: >-
      Денежная оценка «что если бы сегмент подтянулся до бенчмарка» — это не
      предсказание будущих результатов, а иллюстрация масштаба находки.
  - term: "CPA"
    definition: "Стоимость одной конверсии: расход, делённый на число конверсий."
  - term: "CTR"
    definition: "Доля кликов от числа показов объявления или сниппета."
  - term: "CR (конверсия)"
    definition: >-
      Доля визитов или сессий, завершившихся целевым действием (заявка,
      отправка формы, звонок и т.п.).
  - term: "п.п. (процентный пункт)"
    definition: >-
      Разница между двумя долями, выраженная в процентах, а не сама доля.
      Рост с 20% до 25% — это +5 п.п., а не +25%.
  - term: "бренд / небренд"
    definition: >-
      Разделение запросов и трафика на содержащие название компании
      (бренд) и коммерческие запросы категории (небренд).
