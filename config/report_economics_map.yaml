    group: acquisition
    file: acquisition_economics
    path: ["models", {where: {field: "id", equals: "tracked_direct_booking"}}, "value_rub"]
    unit: rub
  - id: acq_tracked_direct_booking_unit
    label: "Единица отслеживаемой конверсии Директа"
    group: acquisition
    file: acquisition_economics
    path: ["models", {where: {field: "id", equals: "tracked_direct_booking"}}, "unit"]
    unit: enum
  - id: acq_tracked_direct_booking_denominator_value
    label: "Знаменатель отслеживаемой модели"
    group: acquisition
    file: acquisition_economics
    path: ["models", {where: {field: "id", equals: "tracked_direct_booking"}}, "denominator", "value"]
    unit: count
  - id: acq_tracked_direct_booking_numerator_amount_rub
    label: "Числитель отслеживаемой модели"
    group: acquisition
    file: acquisition_economics
    path: ["models", {where: {field: "id", equals: "tracked_direct_booking"}}, "numerator", "amount_rub"]
    unit: rub

  # ── Денежная рамка (money_frame.json — список записей) ──────────────
