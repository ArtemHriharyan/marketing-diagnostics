    label: "Единица записи CRM"
    group: crm
    file: acquisition_economics
    path: ["crm", "record_unit"]
    unit: enum
  - id: crm_record_count
    label: "Число записей CRM за период"
    group: crm
    file: acquisition_economics
    path: ["crm", "record_count"]
    unit: count
  - id: crm_total_revenue_rub
    label: "Выручка по данным CRM за период"
    group: crm
    file: acquisition_economics
    path: ["crm", "total_revenue_rub"]
    unit: rub
  - id: crm_average_revenue_rub
    label: "Средний чек записи CRM"
    group: crm
    file: acquisition_economics
    path: ["crm", "average_revenue_rub"]
    unit: rub
  - id: crm_median_revenue_rub
    label: "Медианный чек записи CRM"
    group: crm
    file: acquisition_economics
    path: ["crm", "median_revenue_rub"]
    unit: rub
  - id: crm_unique_customers
    label: "Уникальных клиентов в CRM"
    group: crm
    file: acquisition_economics
    path: ["crm", "unique_customers"]
    unit: count
  - id: crm_average_revenue_per_customer_rub
    label: "Средняя выручка на клиента"
    group: crm
    file: acquisition_economics
    path: ["crm", "average_revenue_per_customer_rub"]
    unit: rub
  - id: crm_status
    label: "Статус блока CRM"
    group: crm
    file: acquisition_economics
    path: ["crm", "status"]
    unit: enum
  - id: crm_limitations
    label: "Оговорки к данным CRM"
    group: crm
    file: acquisition_economics
    path: ["crm", "limitations"]
    unit: list

  # ── Модели привлечения (acquisition_economics.json -> models) ───────
  - id: acquisition_money_basis
    label: "База денег экономики привлечения"
    group: acquisition
    file: acquisition_economics
    path: ["money_basis"]
    unit: enum
  - id: acq_estimated_site_booking_value_rub
    label: "Оценочная стоимость сайт-брони"
    group: acquisition
    file: acquisition_economics
