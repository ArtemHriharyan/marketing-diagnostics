    group: spend
    file: cost_summary
    path: ["total_rub"]
    unit: rub
  - id: spend_by_channel_columns
    label: "Расход по каналам — колонки"
    group: spend
    file: cost_summary
    path: ["channel_total_columns"]
    unit: columns
  - id: spend_by_channel_rows
    label: "Расход по каналам — строки"
    group: spend
    file: cost_summary
    path: ["channel_total_rows"]
    unit: table
  - id: spend_by_component_columns
    label: "Расход по компонентам — колонки"
    group: spend
    file: cost_summary
    path: ["component_total_columns"]
    unit: columns
  - id: spend_by_component_rows
    label: "Расход по компонентам — строки"
    group: spend
    file: cost_summary
    path: ["component_total_rows"]
    unit: table
  - id: spend_by_month_columns
    label: "Расход по месяцам — колонки"
    group: spend
    file: cost_summary
    path: ["monthly_total_columns"]
    unit: columns
  - id: spend_by_month_rows
    label: "Расход по месяцам — строки"
